; ReflectRate.asi: draws only some of the car reflection's six faces each frame, to save processor time.
; Read once when the game starts. Delete ReflectRate.asi to remove it.

[Reflection]
; 6 = every face every frame (the plugin then changes nothing). Any other value: the faces are split as Pattern
; says; only Pattern = even uses the number (3 = half, 2 = a third, 1 = a sixth of the faces a frame).
FacesPerFrame = 3
; balanced = back and left one frame, the other four the next: both frames take the same processor time.
; even = the faces take turns evenly (uneven work: frame times alternate). alternate = front and back every
; frame, the four sides every other frame (if a flicker shows on fast turns).
Pattern = balanced

[Shadow]
; How often the shadow map (the picture of the world from the sun that makes buildings, trees and poles cast shadows)
; is drawn: 1 = every time (the game is left as it is), 2 = every other call. The game draws it twice a frame, so 2
; skips the same one of the two every frame, not alternate frames (one pass may then never be redrawn). Drawing it is about a third of the processor's frame since world shadows came back
; (2026-10-29). Read once when the game starts.
; 1 since 2026-10-30: the user keeps the shadows at their best ("keep the max shadows"); 2 saved only about 2 FPS
; (the game draws the map twice a frame, so every other call skipped the same one).
Every = 1
