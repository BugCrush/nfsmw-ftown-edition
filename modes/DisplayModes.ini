[Modes]
; Sizes offered to the game's Video menu beyond Windows' own (supersampling: the game draws at the chosen size
; and the picture is shrunk into the 1920x1080 window). Comma separated, WIDTHxHEIGHT.
Add = 2240x1260,2560x1440
[Window]
; 1 = keep the game's window inside the screen when a size larger than the screen is chosen (needed: without it
; the window is made the chosen size and only its middle is seen). 0 = leave the Widescreen Fix's placement alone.
FitToScreen = 1
