; VisualBridge.asi: works on the finished 3D picture before the HUD (ambient occlusion, depth view; exposure and
; bloom are kept off: the Xbox 360 pack's look stays as it is).
; Changes here are picked up within a second while the game runs, except [Game] (the effect names, read when the
; game creates its effects) and [Test] FinalShader (compiled once): those need a game restart.
; Delete VisualBridge.asi to remove it.

[Look]
; 1 = on, 0 = off (the picture is then exactly the game's).
Enabled = 1

[Parts]
; Ambient occlusion: soft shading where surfaces meet (corners, under cars, along walls). 0 = off.
AO = 1
; Exposure and bloom (the 2026-10-13 work): off, the pack's look is kept.
Exposure = 0
Bloom = 0
; Edge smoothing: softens stair-steps and shimmer on edges (fences, wires, poles, car outlines), drawn in place of
; the Xbox 360 pack's own copy of the picture to the screen (no extra pass). 0 = off. Kept on by the user (2026-10-23).
AA = 1
; Light shafts: rays from the sun through gaps in trees, buildings and bridges, from the scene's depth. 0 = off.
Shafts = 1
; Distance haze: far things fade gently towards a colour; the sky and near things are left alone. 0 = off.
Haze = 1
; Wet reflections: upward-facing surfaces (the road) mirror what stands above them, from the picture and its
; depth, in the same draw as edge smoothing (no extra pass). Kept by the user 2026-10-29, softer and weaker ([Wet]). 0 = off.
Wet = 1

[AO]
; How dark a fully closed-in corner gets: 0 = not at all, 1 = as dark as it can.
Strength = 0.65
; How far (in metres) surfaces shade each other.
Radius = 0.35
; 1 = worked out at half the screen's size (faster), 0 = full size.
HalfResolution = 0

[AA]
; How much of the smoothed colour is used at an edge: 0 = none, 1 = all. 0.75 keeps thin lines (wires) clearly visible.
Strength = 0.75

[Shafts]
; How bright the rays are (0 = none; 1 = strong).
Strength = 0.7
; How far from the sun the rays reach, as a share of the way from each pixel to the sun (0.05 to 1).
Length = 0.75
; The rays' colour, red,green,blue from 0 to 255.
Colour = 255,240,210

[Haze]
; Distance in metres where the haze starts (nothing nearer changes) and where it is full.
Start = 150
End = 1500
; How far towards the colour the farthest things go: 0 = not at all, 1 = all the way.
Amount = 0.15
; The haze colour, red,green,blue from 0 to 255.
Colour = 200,210,225

[Wet]
; How much of the reflected colour is mixed in: 0 = none, 1 = a mirror. Reflections only ever brighten.
; 0.18 since 2026-10-29 (the user: "make the wetness of the road slightly less"; it was 0.25).
Strength = 0.18
; How soft the reflections are: each pixel's reflection is averaged with four neighbours' this many pixels away
; (diagonally), so the reflected cars and their outlines blur. 0 = sharp, as a mirror. 5 since 2026-10-29 (the user:
; "slightly blurry"). The neighbours share the centre pixel's surface direction (the road is flat).
Blur = 5
; Steps each neighbour's ray takes over the same distance (fewer, longer steps: cheaper). With 8: about 1.3 ms against
; 2.2 ms (all at 16, each working out its own surface) on the stand-in at 1920x1080; sharp reflections 0.5 ms.
BlurSteps = 8
; How many steps a mirrored ray takes (1 to 64; more finds thinner things, costs more) and how far it goes, in metres.
Steps = 16
MaxDistance = 40
; How flat a surface must be to reflect: 1 = only perfectly level, 0.9 = tilted up to about 25 degrees.
MinUp = 0.9
; Reflections fade out over this share of the screen at its edges (where what they would show is off screen).
EdgeFade = 0.1
; Which world axis points up in the game: z (docs/visual-notes.md, "Wet reflections").
UpAxis = z

[Sun]
; Where speed.exe v1.3 keeps the main view (view 1) and the sun's direction. The sun's place on screen comes from
; the view's own matrix (its platform info pointer at View + PlatOffset, the matrix at ClipOffset in it); if that
; cannot be read, from its camera (pointer at View + CameraOffset) with [Depth] FovY. Found in the game's code
; (docs/visual-notes.md, "The sun's place from the game's own matrix"); change only if a race shows them wrong.
View = 0x919650
PlatOffset = 0x0
ClipOffset = 0x80
CameraOffset = 0x40
Direction = 0x8F2404
; 1 = mirror the computed sun left-right / up-down (if the ShowSun marker sits mirrored from the real sun).
FlipX = 0
FlipY = 0

[Shadows]
; 1 = give the game's world shadows back (buildings, trees, poles). With the Xbox 360 pack's shaders the game thinks no
; shadow level is possible and greys out Video > Shadow Detail; this keeps its highest level at Level instead (read
; once at game start: a change needs a restart). 0 = as the game decides (no world shadows). docs/visual-notes.md,
; "Shadows are greyed out".
Unlock = 1
; The highest shadow level the Video menu offers: 1 or 2 (2 = the game's own maximum before the pack).
Level = 2
; Where speed.exe v1.3 sets that level (the function and its two calls) and keeps it; change only with new findings.
Function = 0x6D2100
CallSites = 0x6DB0D5,0x6DFA02
MaxAddress = 0x9018B8

[Depth]
; The game's camera, to turn stored depth into metres: near and far planes (metres), vertical field of view (degrees).
Near = 0.5
Far = 10000
FovY = 62
; 1 = take the near and far planes from the main view's own matrix every frame (Near/Far above only when it cannot be
; read); 0 = Near/Far as set. The game's own values are logged either way (SUN line, planes=near/far), so a race shows
; whether 0.5 / 10000 are right before this is switched on (the review of 2026-10-30).
FromGame = 0

[Debug]
; 1 = show the scene's depth as grey instead of the picture (10 m is middle grey, sky white). For checking.
ShowDepth = 0
; 1 = a magenta cross where VisualBridge computes the sun to be (for checking it sits on the sun).
ShowSun = 0

[Test]
; 1 = left half of the screen the game's own picture, right half ours. For comparing.
SplitScreen = 0
; Seconds between switching the effects off and on (each switch logged), to measure their cost inside one race.
; 0 = always on.
ToggleSeconds = 0
; Which effect the toggle switches: all, or one of ao, aa, shafts, haze, wet (the others then stay as set).
ToggleOnly = all
; 1 = with ToggleSeconds, ambient occlusion also steps through the three sharpness levels below, Blinks off-and-on
; blinks each; 1 to 3 white squares top left show the level while it is on. For choosing a level in one race.
AOShowcase = 0

[AOShowcase]
Blinks = 5
; Level 1: as installed until 2026-10-28 (half size, 1 m reach).
Half1 = 1
Radius1 = 1.0
; Level 2: full size, 0.6 m reach.
Half2 = 0
Radius2 = 0.6
; Level 3: full size, 0.35 m reach.
Half3 = 0
Radius3 = 0.35

[Game]
; Where the pass runs: at the end of these techniques of the pack's colour treatment.
Final = visualtreatment,visualtreatment_branching
; The pack's technique that copies the finished picture to the screen; edge smoothing draws in its place.
PassThrough = screen_passthru
