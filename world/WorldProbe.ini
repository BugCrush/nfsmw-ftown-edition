; WorldProbe.asi settings (F-Town stage 1 diagnostic, version 2; docs/ftown-notes.md "WorldProbe 2").
; Comments stay on their own lines: the game's ini reader does not strip trailing comments.

[Log]
; how often a POS line is written while a player car exists, in milliseconds
IntervalMs = 1000
; the optional parts of a POS line (1 = on, 0 = off). The default line (position, telemetry, speed, height, packs)
; costs well under 1 ms. Every 10 POS lines a COST line gives each part's time in microseconds.
; Sections: the drivable section under the car (FindDrivableSection). Off by default: it reorders the game's
; drivable-section list (moves the one it finds to the head), so it changes game state, though the game does the
; same every frame.
Sections = 0
; Height: the collision face below the car (GetWorldHeightAtPoint, 1 m above the car); a read-only query
Height = 1
; Packs: how many collision packs are loaded (a scan of 2,700 pointers)
Packs = 1
; Scenery: the loaded scenery sections by name (a walk of the game's list, hundreds of entries, and a long line).
; Off by default until a COST line has shown its price in the game.
Scenery = 0
; 1 = at "player found", time one VirtualQuery on the player object and log it (VQPROBE): the check behind
; version 1's cost (about 3.4 microseconds per MB of the memory region, measured on this laptop)
ProbeVirtualQuery = 1

[Teleport]
; 1 = the keys below move the car in a race; 0 = never (the default: no teleport code runs, no key is read)
Enabled = 0
; virtual-key code of the far target: 0x78 = F9
Key = 0x78
; far target in the world files' convention (x, y horizontal, z up, metres; the maps in docs/ftown-notes.md):
; the candidate F-Town place, 5.8 km outside Rockport's drivable sections and 4.0 km outside every section boundary
X = 2000
Y = 11500
Z = 100
; virtual-key code of the "straight up" target: 0x79 = F10; the car is moved AboveMetres up from where it is
; (expected: it falls back and lands, which shows that the teleport itself works)
AboveKey = 0x79
AboveMetres = 20
; after a teleport: one FRAME line for each of the next FrameLines frames, then a POS line every FastIntervalMs
; for FastSeconds
FrameLines = 30
FastSeconds = 30
FastIntervalMs = 100

[Watch]
; 1 = log every call of the game's functions that can put the car somewhere else (the reset path:
; ResetCar::ResetVehicle, ResetCar::ResetTo, PVehicle::SetVehicleOnGround, RigidBody::SetPosition for the player's
; car); log only, the game's function always runs. Costs nothing until such a call happens.
Reset = 1
; at most this many WATCH lines for the player's car per race, renewed after each teleport and each JUMP (the
; rest are counted and the count logged when the race ends)
MaxLines = 200
; at most this many WATCH lines per watched function and caller (return address) until the lines are renewed;
; the rest are counted per caller and listed in a "WATCH callers" line when the race ends (runs E and F: the start
; grid's RigidBody::SetPosition calls in the countdown used up all 200 lines)
PerCallerLines = 10
; at most this many WATCH lines for other cars (traffic, cops, opponents) per race; the rest are only counted
OtherLines = 20
; a JUMP line when the car moves more than this many metres in one frame without a WorldProbe teleport
JumpMetres = 20

[Ring]
; keep the last this many frames (position, speed, the face found 1 m above the car) and log them as RING lines
; when the player's car is reset (needs [Watch] Reset = 1) or falls through the surface; 0 = off, at most 600
; (200 frames: about 2 s at 100 FPS)
Frames = 200
; 1 = one height query a frame for the ring's face column (14-18 us typical on F-Town in run G); its own switch,
; independent of [Log] Height; 0 = no face column and no fall dumps (reset dumps only)
Face = 1
; a fall dumps the ring: the car more than BelowMetres under the face found 1 m above it, or that face more than
; FaceDropMetres lower than the frame before, or no face where there was one (at most one dump a second)
BelowMetres = 0.2
FaceDropMetres = 2.0
