; FTownLoader.asi settings (F-Town; docs/ftown-notes.md "Part 2: the slab and FTownLoader" and "Stage 2: the streets").
; Comments stay on their own lines: the game's ini reader does not strip trailing comments.

[Map]
; the map file, beside this ini in scripts\. ftown-city.bun: the city (built by tools/citymap/build_city.py; its
; numbers in ftown/ftown-city.json); ftown-slab.bun: our test slab (stage 1, spawn 2000, 11430, 101, 90);
; ftown-reloc.bun: Rockport's C9 moved to the place (tools/world/relocate.py, spawn 1989.73, 11521.51, 101.00, 0)
File = ftown-city.bun

[Spawn]
; where the car is put: SpawnN = x, y, z, heading, in the world files' convention (x, y horizontal, z up, metres;
; heading in degrees counter-clockwise from +x, 90 = +y). Spawn1 is used by Go; NextSpawn moves the car to the next
; one (up to 8), each checked for ground first. The city's two: the first route's start at the DND-KMP exit and its
; end on Mathura Road, 1 m above the road, facing along the route (ftown/ftown-city.json "spawns").
Spawn1 = 3231.43, 10414.57, 101.00, 136.6
Spawn2 = 1359.34, 8782.23, 100.93, -94.6
; 1 = set the heading (RigidBody::SetOrientation with the matrix); 0 = keep the car's own
SetHeading = 1

[Keys]
; 0 = the function keys below do nothing: F-Town is entered from the game's menus (Quick Race > Bonus Maps, [Menu]);
; 1 = F8 / F7 / F6 / F5 work as before, and F4 starts the next event ([TimeAttack] NextEventKey) (for testing)
Enabled = 0
; virtual-key codes, read only in a race with the game's window in front. Go (0x77 = F8): load the map, register
; its collision, check the ground under Spawn1, then move the car; pressed again while loaded: unload.
Go = 0x77
; Unload (0x76 = F7): take the map out again; with [Return] Enabled = 1 the car is first put back where it was
; when Go was pressed (also for a second Go while loaded)
Unload = 0x76
; NextSpawn (0x75 = F6): while the map is loaded, move the car to the next spawn (after the last, the first again),
; checked for ground like the first; no ground there: the car stays
NextSpawn = 0x75

[Return]
; 1 = before F7 or a second F8 unloads the map: stream Rockport in at the spot the car left at F8 (the game's
; Sim::SetStream, blocking: a pause of a second or so), check there is ground there, put the car back with its
; heading and no speed, replace the reset's saved spots with that spot, and only then unload. No ground there:
; nothing is unloaded and the car stays on F-Town (logged). Also refused while a menu, the results screen or a
; cut-scene is using the streamer's memory (the game has zone switching off then): press F7 again while driving.
; 0 = unload at once, the car left with no ground
; (the behaviour of runs E and F)
Enabled = 1

[Grid]
; metres added to each collision instance's radius when choosing the world-grid cells to put it in
MarginMetres = 64

[Minimap]
; F-Town's map in the game's own HUD minimap while the car is on F-Town (docs/ftown-race-notes.md R1 and "Task 2").
; 1 = on F8 load File (64 map pieces, tools/citymap/minimap.py) and give the minimap F-Town's numbers below and the
; map name Header, while the car is on F-Town's map; everything is put back on F7 and on leaving the race, and as
; soon as the car is off F-Town's map (a reset or the pause menu's restart to Rockport). With Enabled = 1 the game's
; minimap also skips a map piece number of 64 or more (a bound patched at 0x5673BD; Rockport never makes one).
; 0 = Rockport's minimap as before, nothing patched
Enabled = 1
File = ftown-minimap.bun
Header = FTOWN_MAP
; where the map lies in the world (render metres; the game's TrackInfo calibration): the west edge's x, the south
; edge's y, and the map's width; must match tools/citymap/minimap.py (tools/citymap/tests/test_minimap.py checks)
UpperLeftX = -560
UpperLeftY = 6508
WidthMetres = 5120
; A place of your own on F-Town's minimap, shown with the game's safe-house icon: set SafeHouseIcon to 1 and add
; the key SafeHouse with the value x, y (F-Town's render metres; the plugin's log prints the car's position).
SafeHouseIcon = 0

[Course]
; Run J item 7: during an event (not Free Roam) the course still to drive is a line on the minimap, erased behind the
; car as it goes, like a GPS line: painted into our own minimap textures (the game turns, zooms and masks them as
; always) and put back as the car passes and when the event ends. 0 = no line
Enabled = 1
; the line's width (metres of the map; the map has 2.5 m a pixel)
WidthMetres = 8
; its colour (0xRRGGBB)
Color = 0xFFD200

[TimeAttack]
; F-Town's events: the Time Attack and the others of [Events] File (docs/ftown-race-notes.md "Task 3" and "Events").
; An event: the car to its start, a 3-2-1 countdown with the car held, then the clock runs (the game's simulation
; time: it stops in the pause menu); its gates in order: a checkpoint shows the split, a speed camera reads the car's
; speed (the Speed Trap's score is their sum), the finish stops the clock (the Drag also reads the trap speed there);
; a missed gate means no result. Shown with the game's own HUD message. The best of every event is kept in
; FTownTimes.txt beside this ini. 1 = on; 0 = off (the menu then offers Free Roam only)
Enabled = 1
; with [Keys] Enabled = 1 (testing): Key (0x74 = F5) while F-Town is loaded starts the first event (the Time Attack),
; again to restart it; NextEventKey (0x73 = F4) starts the event after the last one started
Key = 0x74
NextEventKey = 0x73
; width of each gate line across the road, metres
GateWidthMetres = 40
; 1 = the race HUD's own timer and COMPLETE % show the running event (its time, frozen at its end; its progress
; along the gates); 0 = they show the carrier race's (Run I item 7: the race HUD's calls 0x6F1DB6, 0x6F1E00)
ShowRunningTime = 1

[Events]
; the events offered after Free Roam (docs/ftown-race-notes.md "Events"): their names, kinds, starts, gates, barrier
; files and results sections, made by tools/citymap/events.py from the road model (its test checks the file)
File = ftown-events.json
; the speed shown at speed cameras and the Drag's finish: km/h or mph (FTownTimes.txt keeps km/h)
SpeedUnit = km/h

[Barriers]
; the events' race barriers (docs/ftown-race-notes.md R7 and "Events"): Rockport's race-barrier panels and walls
; sealing each event's route, one file an event (ftown-events.json "barriers": ftown-barriers.bun for the Time Attack,
; ftown-barriers-drag.bun, -speedtrap.bun, -sprint.bun), built by tools/citymap/race_barriers.py. 1 = the running
; event's file is loaded when it begins and stays while it is restarted; it goes when another event begins and with
; F-Town (and on F6 with the keys on). Free Roam never has them. 0 = no barriers
Enabled = 1

[Menu]
; the way in (docs/ftown-race-notes.md R5): 1 = a third option on the Quick Race menu, Bonus Maps, then the map list
; (F-Town), then the mode list (Free Roam and the events), then the game's own car select; 0 = the menus as before
Enabled = 1
; the icons (texture hashes of the game's own menu icons): Bonus Maps (Custom Race's), F-Town (Sprint's), Free Roam
; (Quick Play's); each event's is in ftown-events.json ("icon": the Time Attack Tollbooth's, the Drag Drag's, the
; Speed Trap Speedtrap's, the Sector Sprint Sprint's)
IconBonus = 0x2A49B5E2
IconMap = 0x2521E5EB
IconFreeRoam = 0xE6313967
; our own icons for F-Town, F-Town (Evening) and Free Roam (Run I item 13): a texture pack built from the user's
; logos by tools/ftownicons/make_icons.py, beside this file, loaded when the Quick Race menu is first built; missing:
; the icons above
IconFile = ftown-icons.bun

[Game]
; the race that carries F-Town (docs/ftown-race-notes.md R6): a Rockport Sprint by its event id, set with no opponents,
; no cops and no traffic; FTownLoader loads F-Town at the game's GO and starts the mode chosen in the menu
CarrierEvent = 15.2.1
; the race that carries the Drag (Run J item 4): a Rockport drag race (kind 2) by its event id, so the Drag on F-Town
; is the game's own drag race (its HUD with the big tachometer and shift lights, the engine heat and blown engine, the
; perfect shifts, manual gears); the player steers (F-Town has no road network for the game's lane steering). Empty
; (or not a drag race) = the Sprint carrier above, as before
DragCarrierEvent = 11.7.1
; 1 = F-Town at the game's 3-2-1-GO (the car held in Rockport until then); 0 = as soon as the car is there
StartAtGo = 1
; 1 = (with StartAtGo = 1) F-Town and the mode's start as soon as the race runs, before the game's countdown, which
; then counts on F-Town and starts the event (Run I item 12); Restart Race puts the car at the start at once;
; 0 = F-Town at the game's GO and our own 3-2-1 as before
StartEarly = 1
; 1 = the game itself starts our races on F-Town (Run J item 1): the race's intro plays at the mode's start and the
; game's start grid (also at Restart Race) is the mode's start; F-Town is loaded when the intro is placed; 0 = the
; intro and the grid in Rockport (the car moved as StartEarly says)
StartOnFTown = 1
; seconds of game time after the car appears to wait for a countdown that never comes before starting anyway
NoCountdownSeconds = 20
; F-Town's closed edge box (render x0, y0, x1, y1; ftown/ftown-city.json "edge_box"): the car more than 100 m outside
; it (a reset to a Rockport spot) goes back to the mode's start
Box = 629.6, 7072.1, 3370.4, 11063.9

[Traffic]
; real game vehicles standing on F-Town's roads (docs/ftown-race-notes.md R8-R11): the game's own cars (its traffic
; models and the add-on cars), made by the game's factory with no driver (they never drive, but are pushed and hit
; like any car), on spots made by tools/citymap/traffic_spots.py. The game holds at most 20 vehicles at once, so a
; pool of at most Count is kept near the player: a car farther than ReleaseMetres goes to a free spot NearMetres to
; FarMetres from the player (never within ViewMetres in front of the car). In an event the spots by its route stay
; empty. 0 = off
Enabled = 1
File = ftown-traffic.json
; cars at most (the game's list of 20 less the player's car and Reserve free slots for the game). 6 since the moving
; traffic (2026-11-05: 16 before): 1 player + 6 parked leaves 13 of the game's 20 for moving traffic. With moving traffic
; on, parked cars stand only at kerb spots beside a side of the road with two lanes (one stays free; the network
; file's parking list), never in a lane
Count = 6
; 1 = every standing car held braked each frame (gas 0, brake 1, handbrake 1: nothing else holds a car without a
; driver; Run I item 14, a parked Challenger moved on its own); 0 = not held
Hold = 1
Reserve = 2
; the traffic models (the game's pvehicle names), taken in turn
Models = traftaxi, traf4dseda, traf4dsedb, trafficcoup, trafstwag, trafminivan, trafpickupa, trafha, trafcourt, trafvanb, trafnews, trafpizza, trafgarb, trafcemtr
; the add-on cars: AddOnCount of the Count cars are these, one each in turn (racers: 6.4 MB of car memory each)
AddOns = thar, raptor, challenger71, chiron, flipcar, longnosecab
AddOnCount = 6
NearMetres = 40
FarMetres = 300
ReleaseMetres = 380
ViewMetres = 160
SpacingMetres = 12
; how often the cars are checked and moved (milliseconds of the game's simulation time)
UpdateMs = 500
; > 0: every this many seconds all cars are hidden or shown again ("toggle: traffic off / on" in the log), to measure
; their cost in one race with tools/toggle-compare.py; 0 = off
ToggleSeconds = 0

[MovingTraffic]
; the game's own traffic driving on F-Town's roads (docs/ftown-race-notes.md "Moving traffic (2026-11-05)"): F-Town's
; road network (File, from tools/citymap/roadnet_build.py) appended to Rockport's and the world grid widened while
; F-Town is in the race (put back before the track unloads). 0 = off (the carrier races without traffic, as before)
Enabled = 1
File = ftown-roadnet.bin
; the carrier race's traffic: the game's Quick Race levels 1, 2, 3 = 10, 30, 50 % density (0 = none)
Level = 3
; 1 = the events too: traffic on the event's own route, both ways, as in Rockport's races (its exits closed to traffic);
; 0 = no moving traffic in events (Free Roam only)
EventTraffic = 1
; right (shipped: the game's AI is built for it) or left (an experiment: F-Town's lane offsets negated, so forward
; lanes lie left of the centre line; the AI's pulling over and lane edges still assume the right)
DriveOn = right
; each traffic car drives at its road's speed (motorway 80, trunk 70, primary 60, secondary 55, tertiary 45, links 40,
; residential 35, service 20 km/h) times a factor of its own within this many percent
SpeedSpreadPercent = 15

[Evening]
; F-Town (Evening) (docs/ftown-notes.md "Evening (2026-11-05)"): the game's own sunset held while the car is on F-Town,
; and the city's lights (street lamps, Mathura Road lights, signals, billboards, shop fronts, the metro's stations and
; deck lights, some windows). The time of day is put back when F-Town goes, by every way out.
; 1 = the Bonus Maps list offers F-Town (Evening) beside F-Town; 0 = off (F-Town only)
Enabled = 1
; the time of day held (0.05 .. 0.95, the range the game's own clock runs in a race): 0.95 is the west end, the sun
; 7.7 degrees up, the lighting wholly the database's dusk; 0.90 has the sun at 15 degrees, still dusk
Time = 0.95
; 1 = every car's headlights brighter (the game's ForceHeadlightsOn) while F-Town (Evening) is loaded; 0 = as they are
Headlights = 1
; the lights list beside the city (tools/citymap/build_city.py writes it with ftown-city.bun: they go together)
Lights = ftown-evening.bin
; with [Keys] Enabled = 1 (testing): 1 = F8 loads F-Town (Evening); 0 = F8 loads the day's F-Town
Keys = 0

[Breakables]
; the breakable poles (docs/ftown-notes.md "Breakable poles (2026-11-05)"): Rockport's own street lights and signal
; masts on the main roads and at every signal, our lantern lamps on the sector roads; a car knocks them over as
; Rockport's. 1 = on; 0 = off (the poles stay standing and a car passes through them: they have no barrier)
Enabled = 1
; the spawner records beside the city (tools/citymap/build_city.py writes it with ftown-city.bun: they go together)
File = ftown-smackables.bun

[Connection]
; the road between Rockport and F-Town in the career's free roam (docs/ftown-connection-research.md "The connection:
; decisions"): from Rockport's north highway (the T at render 883, 4548) 2.6 km to F-Town's Mathura Road. On when the
; car comes within 1,500 m of the T in free roam; F-Town loads when the car is on the road or in F-Town; cops and
; traffic drive across on the joined road network. 1 = on; 0 = off (Rockport and the Bonus Maps as before)
Enabled = 1
; the connector's own chunks (tools/citymap/connector.py writes both: they go together)
File = ftown-connector.bun
Data = ftown-connect.bin

[Log]
; 1 = write FTownLoader.log beside this ini (rewritten at every start); 0 = no log
Enabled = 1
