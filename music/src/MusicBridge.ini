[Songs]
; Folder with the songs, named <title>_<artist>.mp3. A relative path starts at this file's folder.
Folder = ..\..\CUSTOM SONGS
; 1 = the next-song button also works during races (the game itself allows it only in the menus).
; 0 = leave the game's behaviour as it is.
SkipInRaces = 1

[Player]
; Loudness of custom songs against the game's own. 1.0 = follow the game's music volume as it is.
; Lower it (e.g. 0.7) if custom songs sound louder than the originals. Write the decimal with a
; point, not a comma (0,7 would be read as 0: silence). The loudest a song can get is full level.
Gain = 1.0

[Log]
; 1 = also log every lookup, pick and time-left answer (for testing). 0 = only songs and changes.
Calls = 1
